<header class="headerC">
  <div class="header">
    <a href="#" class="logo">
      <span class="logo-mark" aria-hidden="true">
        <img src="LOGO.png" alt="Logo firmy" width="100" height="100" />
      </span>

      <span class="logo_Text">
        <span class="logo_Title">
            <span class="logo-mech">MECH</span>
            <span class="logo-rent">RENT</span>
        </span>
        
        <span class="logo_Sub">WYPOŻYCZALNIA MASZYN</span>
      </span>
    </a>

    <button
      type="button"
      class="nav_Toggle"
      id="navToggle"
      (click)="toggleMenu()"
      [attr.aria-label]="menuOpen ? 'Zamknij menu' : 'Otwórz menu'"
      [attr.aria-expanded]="menuOpen"
      aria-controls="primaryNav"
    >
      <span></span><span></span><span></span>
    </button>

    <nav class="navigation" id="navigation">
      @for (link of navLinks; track link.label) {
        <a [href]="link.href">{{ link.label }}</a>
      }

      <a href="tel:+48123456789" class="phone_Btn">
        <svg lucidePhone [size]="16"></svg>
        <span class="phone">+48 123 456 789</span>
      </a>
    </nav>
  </div>

  <nav class="navigation_mobile" id="primaryNav" [class.open]="menuOpen">
    @for (link of navLinks; track link.label) {
      <a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
    }

    <a href="tel:+48123456789" class="mobile_phone" (click)="closeMenu()">
      +48 123 456 789
    </a>
  </nav>
</header>
